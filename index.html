<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add PS Exterior Wall</title>
    <style>
        /* --- CSS: การตกแต่งหน้าตา --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 40px;
        }

        .control-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 700px;
            margin: 0 auto;
        }

        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .primary-btn {
            background-color: #0066cc;
            color: white;
            box-shadow: 0 2px 4px rgba(0, 102, 204, 0.3);
        }

        .primary-btn:hover {
            background-color: #0052a3;
            transform: translateY(-1px);
        }

        .primary-btn:active {
            transform: translateY(1px);
        }

        .condition-group {
            display: flex;
            gap: 25px;
        }

        /* การออกแบบ Toggle Switch */
        .toggle-switch {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .toggle-switch input {
            display: none;
        }

        .slider {
            position: relative;
            width: 44px;
            height: 24px;
            background-color: #d1d5db;
            border-radius: 24px;
            margin-right: 12px;
            transition: 0.3s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-switch input:checked + .slider {
            background-color: #10b981; /* สีเขียวเมื่อเปิด */
        }

        .toggle-switch input:checked + .slider:before {
            transform: translateX(20px);
        }

        .label-text {
            font-size: 15px;
            font-weight: 600;
            color: #374151;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- --- HTML: โครงสร้างแถบเครื่องมือ --- -->
    <div class="control-bar">
        <!-- ปุ่มทำงานหลัก -->
        <div class="action-group">
            <button id="btnCreatePS" class="btn primary-btn">
                + Create PS (IM Mode)
            </button>
        </div>

        <!-- เงื่อนไขระบบ Auto -->
        <div class="condition-group">
            <label class="toggle-switch">
                <input type="checkbox" id="chkItemAuto">
                <span class="slider"></span>
                <span class="label-text">Item Auto</span>
            </label>

            <label class="toggle-switch">
                <input type="checkbox" id="chkPSAuto">
                <span class="slider"></span>
                <span class="label-text">PS Auto</span>
            </label>
        </div>
    </div>

    <!-- --- JavaScript: การทำงานและเงื่อนไข --- -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const btnCreatePS = document.getElementById('btnCreatePS');
            const chkItemAuto = document.getElementById('chkItemAuto');
            const chkPSAuto = document.getElementById('chkPSAuto');

            // 1. การทำงานเมื่อกดปุ่ม Create PS (IM Mode)
            btnCreatePS.addEventListener('click', () => {
                alert("ดำเนินการ: กำลังสร้าง PS (IM Mode)...");
                console.log(">> Execute: Create PS in IM Mode");
                console.log(">> Current Status -> Item Auto: " + chkItemAuto.checked + ", PS Auto: " + chkPSAuto.checked);
            });

            // 2. เงื่อนไขเปิด/ปิด Item Auto
            chkItemAuto.addEventListener('change', (e) => {
                if (e.target.checked) {
                    chkPSAuto.checked = false; // บังคับปิด PS Auto
                    console.log("Condition: [Item Auto] ถูกเปิดใช้งาน");
                }
            });

            // 3. เงื่อนไขเปิด/ปิด PS Auto
            chkPSAuto.addEventListener('change', (e) => {
                if (e.target.checked) {
                    chkItemAuto.checked = false; // บังคับปิด Item Auto
                    console.log("Condition: [PS Auto] ถูกเปิดใช้งาน");
                }
            });

        });
    </script>
</body>
</html>
